<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>网飞猫</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b10; color: #f2f2f5;
    font-family: -apple-system, "PingFang SC", sans-serif; }
  .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 24px; box-sizing: border-box; text-align: center; }
  .logo { width: 84px; height: 84px; border-radius: 20px; background: #14141c;
    display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
  .logo svg { width: 54px; height: 54px; }
  h1 { font-size: 22px; margin: 0 0 6px; font-weight: 600; }
  .sub { color: #9a9aa5; font-size: 13px; margin: 0 0 26px; }
  .status { font-size: 14px; color: #c9c9d2; min-height: 20px; margin-bottom: 18px; }
  .spin { width: 26px; height: 26px; border-radius: 50%; margin: 0 auto 14px;
    border: 3px solid rgba(255,255,255,.15); border-top-color: #d81e26;
    animation: sp 0.9s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .chips { display: none; flex-direction: column; gap: 10px; width: 100%; max-width: 320px; }
  .chips button { border: 1px solid #2a2a35; background: #17171f; color: #f2f2f5;
    border-radius: 12px; padding: 13px; font-size: 15px; }
  .chips button.retry { background: #d81e26; border-color: #d81e26; }
  .foot { margin-top: 30px; color: #55555f; font-size: 11px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <svg viewBox="0 0 100 100"><path d="M68 18 A38 38 0 1 0 68 82 A30 30 0 1 1 68 18 Z" fill="#d81e26"/></svg>
  </div>
  <h1>网飞猫</h1>
  <p class="sub">一起看更好的世界</p>
  <div class="spin" id="spin"></div>
  <div class="status" id="status">正在连接…</div>
  <div class="chips" id="chips"></div>
  <div class="foot">域名由远程配置维护，站点换域名无需重装</div>
</div>
<script>
(function () {
  var CONFIG_URL = 'https://raw.githubusercontent.com/cyber-812/ncat-ios/main/config.json';
  var DEFAULT_DOMAINS = ['https://www.ncat23.com'];
  var statusEl = document.getElementById('status');
  var chipsEl = document.getElementById('chips');
  var spinEl = document.getElementById('spin');

  function setStatus(t) { statusEl.textContent = t; }

  function probe(domain, timeoutMs) {
    return new Promise(function (resolve) {
      var started = Date.now();
      var done = false;
      var timer = setTimeout(function () { if (!done) { done = true; resolve(null); } }, timeoutMs);
      fetch(domain + '/?__ncat_probe=' + started, { mode: 'no-cors', cache: 'no-store' })
        .then(function () {
          if (!done) { done = true; clearTimeout(timer); resolve(Date.now() - started); }
        })
        .catch(function () {
          if (!done) { done = true; clearTimeout(timer); resolve(null); }
        });
    });
  }

  function go(domain) {
    try { localStorage.setItem('ncat-lastgood', domain); } catch (e) {}
    setStatus('已连接 ' + domain.replace('https://', '') + '，正在打开…');
    location.replace(domain + '/');
  }

  function showChoices(domains) {
    spinEl.style.display = 'none';
    setStatus('自动连接失败，检查网络后重试，或手动选择：');
    chipsEl.style.display = 'flex';
    chipsEl.innerHTML = '';
    var retry = document.createElement('button');
    retry.className = 'retry';
    retry.textContent = '重新自动连接';
    retry.addEventListener('click', function () { location.reload(); });
    chipsEl.appendChild(retry);
    domains.forEach(function (d) {
      var b = document.createElement('button');
      b.textContent = d.replace('https://', '');
      b.addEventListener('click', function () { go(d); });
      chipsEl.appendChild(b);
    });
  }

  function pick(domains) {
    var lastGood = null;
    try { lastGood = localStorage.getItem('ncat-lastgood'); } catch (e) {}
    var order = domains.slice();
    if (lastGood && order.indexOf(lastGood) >= 0) {
      order.splice(order.indexOf(lastGood), 1);
      order.unshift(lastGood);
    }
    // 先探排第一的域名（通常是上次的好域名）
    probe(order[0], 3000).then(function (ms) {
      if (ms !== null) { go(order[0]); return; }
      var rest = order.slice(1);
      if (!rest.length) { showChoices(order); return; }
      // 其余域名并发测活取最快；已失败的第一名不重复探，省时间（审查 Minor）
      var probes = rest.map(function (d) {
        return probe(d, 5000).then(function (m) { return { d: d, ms: m }; });
      });
      Promise.all(probes).then(function (results) {
        var alive = results.filter(function (r) { return r.ms !== null; });
        if (!alive.length) { showChoices(order); return; }
        alive.sort(function (a, b) { return a.ms - b.ms; });
        go(alive[0].d);
      });
    });
  }

  function start() {
    var configTimeout = new Promise(function (resolve) {
      setTimeout(function () { resolve(null); }, 3500);
    });
    var configFetch = fetch(CONFIG_URL + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .catch(function () { return null; });
    Promise.race([configFetch, configTimeout]).then(function (cfg) {
      var domains = DEFAULT_DOMAINS;
      if (cfg && cfg.domains && cfg.domains.length) {
        // 只接受 https:// 开头的条目，配置写错时不至于静默跳去奇怪地址（审查 Minor）
        var valid = cfg.domains.map(function (d) { return String(d).trim(); })
          .filter(function (d) { return d.indexOf('https://') === 0; });
        if (valid.length) domains = valid;
      }
      pick(domains);
    });
  }

  start();
})();
</script>
</body>
</html>
